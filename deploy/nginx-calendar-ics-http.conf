# Nest calendar ICS feed: HTTP-CONTEXT INCLUDE ONLY.
#
# Include this file exactly once inside nginx.conf's http{} block (or an
# http-context include such as /etc/nginx/conf.d/*.conf). Never include it
# inside a server{} or location{} block. Include the companion
# nginx-calendar-ics-cloudflare-real-ip.conf in the same http{} context.
#
# Validation before installing/reloading:
#   python3 deploy/validate-nginx-calendar-ics.py
#   nginx -t
# The log format deliberately uses $uri and never $request, $request_uri,
# $args, or $query_string, so the bearer token cannot enter this route log.
# The rate zone uses $binary_remote_addr after the trusted Cloudflare real-IP
# module has replaced the edge address with the visitor address.

log_format nest_calendar_ics_redacted
    '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" '
    '$status $body_bytes_sent';

limit_req_zone $binary_remote_addr zone=nest_calendar_ics_per_ip:10m rate=300r/m;
