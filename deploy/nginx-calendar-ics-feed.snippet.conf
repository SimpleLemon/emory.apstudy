# Calendar ICS share-feed edge controls.
#
# This repository does not contain the authoritative Nginx server block. The
# deploy operator must include the limit_req_zone and log_format directives in
# the http{} context, and the location block in the production server{} block.
# Replace the proxy_pass target with the site's existing upstream. Keep the
# exact-match location so query strings are not used for routing or caching.

# http{} context:
limit_req_zone $binary_remote_addr zone=nest_calendar_ics_per_ip:10m rate=300r/m;
log_format nest_calendar_ics_redacted '$remote_addr [$time_iso8601] "$request_method $uri $server_protocol" $status $body_bytes_sent';

# server{} context:
location = /api/calendar/share-feed.ics {
    limit_req zone=nest_calendar_ics_per_ip burst=30 nodelay;
    limit_req_status 429;
    proxy_cache off;
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    access_log /var/log/nginx/nest-calendar-ics-access.log nest_calendar_ics_redacted;
    proxy_pass http://127.0.0.1:8000;
}

# Apply this named location in the same server{} context so throttled clients
# receive the required coarse retry hint without exposing query-string data.
error_page 429 = @nest_calendar_ics_rate_limited;
location @nest_calendar_ics_rate_limited {
    add_header Retry-After 60 always;
    return 429;
}
