# Nest calendar ICS feed: SERVER-CONTEXT INCLUDE ONLY.
#
# Include this file exactly once inside the HTTPS server{} block for
# nest.apstudy.org, before the existing catch-all `location /`. Do not include
# it from nginx.conf/http{}, conf.d/, or a location{} block: the named
# location and the exact-match route are server-context directives.
#
# Install the two companion HTTP-context files first:
#   deploy/nginx-calendar-ics-cloudflare-real-ip.conf
#   deploy/nginx-calendar-ics-http.conf
# The HTTP companion defines `limit_req_zone $binary_remote_addr
# zone=nest_calendar_ics_per_ip:10m rate=300r/m;` and the redacted log format
# uses `$uri` rather than the token-bearing request line.
#
# Validation before reload:
#   python3 deploy/validate-nginx-calendar-ics.py
#   nginx -t
# Then reload Nginx only after the exact route is active with the application
# feature still disabled. The route intentionally duplicates the proxy headers
# used by the production location / because proxy_set_header directives are
# scoped/inherited by configuration level, not copied from sibling locations.

location = /api/calendar/share-feed.ics {
    # Keep this route's diagnostics out of the normal error log. In particular,
    # limit_req refusals are logged at error level by default; crit suppresses
    # those messages, which may contain the tokenized request line.
    error_log /var/log/nginx/nest-calendar-ics-error.log crit;
    access_log /var/log/nginx/nest-calendar-ics-access.log nest_calendar_ics_redacted;

    limit_req zone=nest_calendar_ics_per_ip burst=30 nodelay;
    limit_req_status 429;

    # Keep the 429 response local to this exact feed location. The named
    # handler below is not a redirect and never proxies the token-bearing URI.
    error_page 429 = @nest_calendar_ics_rate_limited;

    proxy_cache off;
    proxy_cache_bypass 1;
    proxy_no_cache 1;
    proxy_hide_header Content-Disposition;
    add_header Cache-Control "private, no-store, no-transform" always;
    add_header X-Content-Type-Options nosniff always;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_pass http://127.0.0.1:8000;
}

# Named locations are server-context directives. This is reached only by the
# exact feed location's scoped error_page above.
location @nest_calendar_ics_rate_limited {
    internal;
    error_log /var/log/nginx/nest-calendar-ics-error.log crit;
    access_log /var/log/nginx/nest-calendar-ics-access.log nest_calendar_ics_redacted;
    add_header Retry-After 60 always;
    add_header Cache-Control "private, no-store, no-transform" always;
    add_header X-Content-Type-Options nosniff always;
    return 429;
}
