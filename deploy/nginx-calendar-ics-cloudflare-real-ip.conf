# Nest calendar ICS feed: HTTP-CONTEXT INCLUDE ONLY.
#
# Include this file exactly once inside nginx.conf's http{} block (or an
# http-context include such as /etc/nginx/conf.d/*.conf). Never include it
# inside a server{} or location{} block. It must be loaded before the server
# that serves the ICS feed so Cloudflare's CF-Connecting-IP is trusted only
# from Cloudflare's published networks.
#
# Official lists checked 2026-08-27:
#   https://www.cloudflare.com/ips-v4
#   https://www.cloudflare.com/ips-v6
# Refresh this file when Cloudflare changes those lists, then run:
#   python3 deploy/validate-nginx-calendar-ics.py
#   nginx -t
# Do not replace these CIDRs with `set_real_ip_from 0.0.0.0/0`, `::/0`, or an
# untrusted proxy header. real_ip_recursive is intentional: Nginx chooses the
# last non-trusted address in the forwarded chain.

set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
